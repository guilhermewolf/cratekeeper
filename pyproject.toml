[project]
name = "liborg"
version = "0.1.0"
description = "24/7 music library organizer for DJs — indexes your library, finds duplicates, and tracks Mixed In Key + rekordbox status for every song"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Guilherme Wolf" }]
keywords = ["dj", "rekordbox", "mixed-in-key", "music-library", "duplicates"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "mutagen>=1.47",
    "pyrekordbox>=0.4",
    "watchdog>=4.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
liborg = "liborg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["liborg"]

[tool.ruff]
line-length = 100
